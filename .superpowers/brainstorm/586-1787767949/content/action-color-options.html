<style>
  #action-color-options {
    --action-blue: #2563eb;
    --action-indigo: #4f46e5;
    --action-violet: #7c3aed;
    --action-magenta: #c026d3;
    --action-pink: #db2777;
    --action-coral: #f35b45;
    --action-orange: #f97316;
    --action-red: #dc2626;
    color: var(--foreground);
  }

  #action-color-options .preview-stack {
    display: grid;
    gap: 18px;
  }

  #action-color-options .preview {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
  }

  #action-color-options .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  #action-color-options .preview-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
  }

  #action-color-options .page-primary {
    width: 32px;
    height: 8px;
    border-radius: 99px;
    background: #873ff2;
  }

  #action-color-options .preview-body {
    padding: 14px 16px 16px;
  }

  #action-color-options .table-head,
  #action-color-options .table-row {
    display: grid;
    grid-template-columns: minmax(110px, 1fr) minmax(90px, .7fr) minmax(300px, 2.5fr);
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
  }

  #action-color-options .table-head {
    color: var(--muted-foreground);
    background: color-mix(in srgb, #873ff2 8%, var(--card));
    font-weight: 500;
  }

  #action-color-options .table-row {
    border-bottom: 1px solid var(--border);
  }

  #action-color-options .table-row:last-child {
    border-bottom: 0;
  }

  #action-color-options .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
  }

  #action-color-options .action {
    min-height: 28px;
    padding: 4px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--action-color);
    font: inherit;
    font-weight: 500;
  }

  #action-color-options .action:hover,
  #action-color-options .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 12%, transparent);
  }

  #action-color-options .action.edit { --action-color: var(--action-blue); }
  #action-color-options .action.detail { --action-color: var(--action-pink); }
  #action-color-options .action.execute { --action-color: var(--action-orange); }
  #action-color-options .action.configure { --action-color: var(--action-indigo); }
  #action-color-options .action.global { --action-color: var(--action-magenta); }
  #action-color-options .action.delete { --action-color: var(--action-red); }

  #action-color-options .tint .action {
    background: color-mix(in srgb, var(--action-color) 11%, transparent);
  }

  #action-color-options .tint .action:hover,
  #action-color-options .tint .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 19%, transparent);
  }

  #action-color-options .family .action.read { --action-color: var(--action-blue); }
  #action-color-options .family .action.write { --action-color: var(--action-violet); }
  #action-color-options .family .action.run { --action-color: var(--action-orange); }
  #action-color-options .family .action.risk { --action-color: var(--action-red); }

  #action-color-options .choice-line {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }

  #action-color-options .choice-copy {
    min-width: 0;
  }

  #action-color-options .choice-copy h3 {
    margin: 0 0 4px;
  }

  #action-color-options .choice-copy p {
    margin: 0;
    color: var(--muted-foreground);
  }

  #action-color-options .recommended {
    flex: 0 0 auto;
    color: var(--action-magenta);
    font-weight: 500;
  }

  @media (max-width: 620px) {
    #action-color-options .table-head,
    #action-color-options .table-row {
      grid-template-columns: 1fr;
    }

    #action-color-options .table-head span:not(:last-child),
    #action-color-options .table-row > span:nth-child(2) {
      display: none;
    }
  }
</style>

<div id="action-color-options">
  <h2>操作按钮配色方向</h2>
  <p class="subtitle">三种方案均避开黄色、灰色、绿色和青色；示例页面主色为紫色。</p>

  <div class="preview-stack">
    <div class="option preview" data-choice="a" onclick="toggleSelect(this)">
      <div class="preview-body">
        <div class="choice-line">
          <div class="choice-copy">
            <h3>A · 高区分亮色文字</h3>
            <p>每个操作固定语义色；只在悬停时出现轻背景，表格最清爽。</p>
          </div>
          <span class="recommended">推荐</span>
        </div>
        <div class="preview-header">
          <span class="preview-heading"><span class="page-primary"></span>变量管理</span>
          <span class="text-muted">页面主色</span>
        </div>
        <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
        <div class="table-row">
          <span>近 30 天申请次数</span><span>数值</span>
          <span class="actions">
            <button class="action edit">编辑</button>
            <button class="action detail">详情</button>
            <button class="action execute">测试</button>
            <button class="action configure">选项</button>
            <button class="action global">转为全局</button>
            <button class="action delete">删除</button>
          </span>
        </div>
      </div>
    </div>

    <div class="option preview tint" data-choice="b" onclick="toggleSelect(this)">
      <div class="preview-body">
        <div class="choice-line">
          <div class="choice-copy">
            <h3>B · 淡底亮色标签</h3>
            <p>区分度最高，但操作多时视觉密度更大、容易抢表格内容。</p>
          </div>
        </div>
        <div class="preview-header">
          <span class="preview-heading"><span class="page-primary"></span>变量管理</span>
          <span class="text-muted">页面主色</span>
        </div>
        <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
        <div class="table-row">
          <span>近 30 天申请次数</span><span>数值</span>
          <span class="actions">
            <button class="action edit">编辑</button>
            <button class="action detail">详情</button>
            <button class="action execute">测试</button>
            <button class="action configure">选项</button>
            <button class="action global">转为全局</button>
            <button class="action delete">删除</button>
          </span>
        </div>
      </div>
    </div>

    <div class="option preview family" data-choice="c" onclick="toggleSelect(this)">
      <div class="preview-body">
        <div class="choice-line">
          <div class="choice-copy">
            <h3>C · 操作族分色</h3>
            <p>按查看、修改、执行、危险四组归类，语义稳定但同组按钮不再逐一分色。</p>
          </div>
        </div>
        <div class="preview-header">
          <span class="preview-heading"><span class="page-primary"></span>变量管理</span>
          <span class="text-muted">页面主色</span>
        </div>
        <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
        <div class="table-row">
          <span>近 30 天申请次数</span><span>数值</span>
          <span class="actions">
            <button class="action write">编辑</button>
            <button class="action read">详情</button>
            <button class="action run">测试</button>
            <button class="action write">选项</button>
            <button class="action write">转为全局</button>
            <button class="action risk">删除</button>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
