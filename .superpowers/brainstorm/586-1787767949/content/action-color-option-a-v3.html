<style>
  #action-color-a-v3 {
    --page-primary: #873ff2;
    --action-detail: #1677ff;
    --action-execute: #f97316;
    --action-configure: #d42ac6;
    --action-global: #4338ca;
    --action-delete: #e1193f;
    color: var(--foreground);
  }

  #action-color-a-v3 .mockup { overflow: hidden; }

  #action-color-a-v3 .page-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  #action-color-a-v3 .page-title,
  #action-color-a-v3 .actions,
  #action-color-a-v3 .pair-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
  }

  #action-color-a-v3 .page-title { gap: 10px; font-weight: 500; }

  #action-color-a-v3 .primary-swatch {
    width: 34px;
    height: 8px;
    border-radius: 99px;
    background: var(--page-primary);
  }

  #action-color-a-v3 .table-head,
  #action-color-a-v3 .table-row {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) minmax(90px, .55fr) minmax(350px, 2.4fr);
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
  }

  #action-color-a-v3 .table-head {
    color: var(--muted-foreground);
    background: color-mix(in srgb, var(--page-primary) 8%, var(--card));
    font-weight: 500;
  }

  #action-color-a-v3 .table-row { border-bottom: 1px solid var(--border); }

  #action-color-a-v3 .action {
    min-height: 28px;
    padding: 4px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--action-color);
    font: inherit;
    font-weight: 500;
  }

  #action-color-a-v3 .action:hover,
  #action-color-a-v3 .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 13%, transparent);
  }

  #action-color-a-v3 .edit { --action-color: var(--page-primary); }
  #action-color-a-v3 .detail { --action-color: var(--action-detail); }
  #action-color-a-v3 .execute { --action-color: var(--action-execute); }
  #action-color-a-v3 .configure { --action-color: var(--action-configure); }
  #action-color-a-v3 .global { --action-color: var(--action-global); }
  #action-color-a-v3 .delete { --action-color: var(--action-delete); }

  #action-color-a-v3 .pair-check {
    margin-top: 16px;
    padding: 13px 15px;
    border-left: 3px solid var(--action-configure);
    background: color-mix(in srgb, var(--action-configure) 7%, transparent);
  }

  #action-color-a-v3 .pair-check strong {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  #action-color-a-v3 .rule-line {
    margin-top: 14px;
    color: var(--muted-foreground);
  }

  #action-color-a-v3 .confirm-choice { margin-top: 18px; }

  @media (max-width: 640px) {
    #action-color-a-v3 .table-head,
    #action-color-a-v3 .table-row { grid-template-columns: 1fr; }
    #action-color-a-v3 .table-head span:not(:last-child),
    #action-color-a-v3 .table-row > span:nth-child(2) { display: none; }
  }
</style>

<div id="action-color-a-v3">
  <h2>A 方案第三版</h2>
  <p class="subtitle">编辑跟随主题主色；其余操作使用独立亮色，并避开黄、灰、绿、青。</p>

  <div class="mockup">
    <div class="page-bar">
      <span class="page-title"><span class="primary-swatch"></span>变量管理</span>
      <span class="text-muted">当前主题：凝液紫</span>
    </div>
    <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
    <div class="table-row">
      <span>近 30 天申请次数</span><span>数值</span>
      <span class="actions">
        <button class="action edit">编辑</button>
        <button class="action detail">详情</button>
        <button class="action execute">测试</button>
        <button class="action configure">选项</button>
        <button class="action global">转为全局</button>
        <button class="action delete">删除</button>
      </span>
    </div>
  </div>

  <div class="pair-check">
    <strong>重点复核：选项 / 转为全局</strong>
    <div class="pair-row">
      <button class="action configure">选项 · 洋红</button>
      <button class="action global">转为全局 · 靛蓝</button>
    </div>
  </div>

  <p class="rule-line">删除固定为红色；编辑固定跟随主题；其他语义色保持全站一致，并在与主题过近时使用备用亮色。</p>

  <div class="options confirm-choice">
    <div class="option" data-choice="a-v3" onclick="toggleSelect(this)">
      <div class="letter">A3</div>
      <div class="content">
        <h3>采用这一版</h3>
        <p>纯文字形态、亮色分离、编辑使用主题色。</p>
      </div>
    </div>
  </div>
</div>
