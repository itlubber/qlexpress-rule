<style>
  #action-color-a-v2 {
    --action-edit: #1677ff;
    --action-detail: #d42ac6;
    --action-execute: #f97316;
    --action-configure: #7c3aed;
    --action-global: #4338ca;
    --action-delete: #e1193f;
    color: var(--foreground);
  }

  #action-color-a-v2 .mockup {
    overflow: hidden;
  }

  #action-color-a-v2 .page-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  #action-color-a-v2 .page-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
  }

  #action-color-a-v2 .primary-swatch {
    width: 34px;
    height: 8px;
    border-radius: 99px;
    background: #873ff2;
  }

  #action-color-a-v2 .table-head,
  #action-color-a-v2 .table-row {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) minmax(90px, .55fr) minmax(350px, 2.4fr);
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
  }

  #action-color-a-v2 .table-head {
    color: var(--muted-foreground);
    background: color-mix(in srgb, #873ff2 8%, var(--card));
    font-weight: 500;
  }

  #action-color-a-v2 .table-row {
    border-bottom: 1px solid var(--border);
  }

  #action-color-a-v2 .actions,
  #action-color-a-v2 .pair-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
  }

  #action-color-a-v2 .action {
    min-height: 28px;
    padding: 4px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--action-color);
    font: inherit;
    font-weight: 500;
  }

  #action-color-a-v2 .action:hover,
  #action-color-a-v2 .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 13%, transparent);
  }

  #action-color-a-v2 .edit { --action-color: var(--action-edit); }
  #action-color-a-v2 .detail { --action-color: var(--action-detail); }
  #action-color-a-v2 .execute { --action-color: var(--action-execute); }
  #action-color-a-v2 .configure { --action-color: var(--action-configure); }
  #action-color-a-v2 .global { --action-color: var(--action-global); }
  #action-color-a-v2 .delete { --action-color: var(--action-delete); }

  #action-color-a-v2 .pair-checks {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  #action-color-a-v2 .pair-check {
    padding: 12px 14px;
    border-left: 3px solid var(--pair-color);
    background: color-mix(in srgb, var(--pair-color) 7%, transparent);
  }

  #action-color-a-v2 .pair-check strong {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  #action-color-a-v2 .pair-check.edit-option { --pair-color: var(--action-edit); }
  #action-color-a-v2 .pair-check.detail-global { --pair-color: var(--action-detail); }

  #action-color-a-v2 .rule-line {
    margin-top: 14px;
    color: var(--muted-foreground);
  }

  #action-color-a-v2 .confirm-choice {
    margin-top: 18px;
  }

  @media (max-width: 640px) {
    #action-color-a-v2 .table-head,
    #action-color-a-v2 .table-row,
    #action-color-a-v2 .pair-checks {
      grid-template-columns: 1fr;
    }

    #action-color-a-v2 .table-head span:not(:last-child),
    #action-color-a-v2 .table-row > span:nth-child(2) {
      display: none;
    }
  }
</style>

<div id="action-color-a-v2">
  <h2>A 方案第二版</h2>
  <p class="subtitle">拉开蓝、洋红、橙、紫、靛蓝和红的距离；不使用黄、灰、绿、青。</p>

  <div class="mockup">
    <div class="page-bar">
      <span class="page-title"><span class="primary-swatch"></span>变量管理</span>
      <span class="text-muted">页面主色：紫</span>
    </div>
    <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
    <div class="table-row">
      <span>近 30 天申请次数</span><span>数值</span>
      <span class="actions">
        <button class="action edit">编辑</button>
        <button class="action detail">详情</button>
        <button class="action execute">测试</button>
        <button class="action configure">选项</button>
        <button class="action global">转为全局</button>
        <button class="action delete">删除</button>
      </span>
    </div>
  </div>

  <div class="pair-checks">
    <div class="pair-check edit-option">
      <strong>编辑 / 选项</strong>
      <div class="pair-row">
        <button class="action edit">编辑 · 亮蓝</button>
        <button class="action configure">选项 · 电紫</button>
      </div>
    </div>
    <div class="pair-check detail-global">
      <strong>详情 / 转为全局</strong>
      <div class="pair-row">
        <button class="action detail">详情 · 洋红</button>
        <button class="action global">转为全局 · 靛蓝</button>
      </div>
    </div>
  </div>

  <p class="rule-line">落地时会检测当前主题主色；某个操作色若过近，就从同语义备用亮色中切换，同时保证同一操作列不撞色。</p>

  <div class="options confirm-choice">
    <div class="option" data-choice="a-v2" onclick="toggleSelect(this)">
      <div class="letter">A2</div>
      <div class="content">
        <h3>采用这一版</h3>
        <p>保留纯文字按钮，只调整颜色映射与悬停反馈。</p>
      </div>
    </div>
  </div>
</div>
