<style>
  #action-color-a-v4 {
    --theme-blue: #2639e9;
    --action-detail: #1677ff;
    --action-execute: #f97316;
    --action-configure: #d42ac6;
    --action-global: #4338ca;
    --action-delete: #e1193f;
    color: var(--foreground);
  }

  #action-color-a-v4 .mockup { overflow: hidden; }

  #action-color-a-v4 .page-bar,
  #action-color-a-v4 .actions,
  #action-color-a-v4 .focus-pair {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
  }

  #action-color-a-v4 .page-bar {
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }

  #action-color-a-v4 .table-head,
  #action-color-a-v4 .table-row {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) minmax(90px, .55fr) minmax(350px, 2.4fr);
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
  }

  #action-color-a-v4 .table-head {
    color: var(--muted-foreground);
    background: color-mix(in srgb, #873ff2 8%, var(--card));
    font-weight: 500;
  }

  #action-color-a-v4 .table-row { border-bottom: 1px solid var(--border); }

  #action-color-a-v4 .action {
    min-height: 28px;
    padding: 4px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--action-color);
    font: inherit;
    font-weight: 500;
  }

  #action-color-a-v4 .action:hover,
  #action-color-a-v4 .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 13%, transparent);
  }

  #action-color-a-v4 .edit { --action-color: var(--theme-blue); }
  #action-color-a-v4 .detail { --action-color: var(--action-detail); }
  #action-color-a-v4 .execute { --action-color: var(--action-execute); }
  #action-color-a-v4 .configure { --action-color: var(--action-configure); }
  #action-color-a-v4 .global { --action-color: var(--action-global); }
  #action-color-a-v4 .delete { --action-color: var(--action-delete); }

  #action-color-a-v4 .focus-pair {
    margin-top: 16px;
    padding: 12px 14px;
    border-left: 3px solid var(--action-configure);
    background: color-mix(in srgb, var(--action-configure) 7%, transparent);
  }

  #action-color-a-v4 .rule-line {
    margin-top: 14px;
    color: var(--muted-foreground);
  }

  #action-color-a-v4 .confirm-choice { margin-top: 18px; }

  @media (max-width: 640px) {
    #action-color-a-v4 .table-head,
    #action-color-a-v4 .table-row { grid-template-columns: 1fr; }
    #action-color-a-v4 .table-head span:not(:last-child),
    #action-color-a-v4 .table-row > span:nth-child(2) { display: none; }
  }
</style>

<div id="action-color-a-v4">
  <h2>A 方案第四版</h2>
  <p class="subtitle">编辑固定使用主题蓝；选项与转为全局继续使用非相邻色。</p>

  <div class="mockup">
    <div class="page-bar">
      <span>变量管理</span>
      <span class="text-muted">示例页面主色：凝液紫</span>
    </div>
    <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
    <div class="table-row">
      <span>近 30 天申请次数</span><span>数值</span>
      <span class="actions">
        <button class="action edit">编辑</button>
        <button class="action detail">详情</button>
        <button class="action execute">测试</button>
        <button class="action configure">选项</button>
        <button class="action global">转为全局</button>
        <button class="action delete">删除</button>
      </span>
    </div>
  </div>

  <div class="focus-pair">
    <button class="action configure">选项 · 洋红</button>
    <button class="action global">转为全局 · 靛蓝</button>
  </div>

  <p class="rule-line">固定规则：编辑 = 主题蓝 #2639E9；删除 = 红色；其余操作色不使用黄、灰、绿、青，并避免贴近页面主色。</p>

  <div class="options confirm-choice">
    <div class="option" data-choice="a-v4" onclick="toggleSelect(this)">
      <div class="letter">A4</div>
      <div class="content">
        <h3>采用这一版</h3>
        <p>固定主题蓝编辑色，保留高区分亮色文字按钮。</p>
      </div>
    </div>
  </div>
</div>
