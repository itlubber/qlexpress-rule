<style>
  #action-color-a-v5 {
    --configured-primary: #873ff2;
    --action-detail: #0b6bff;
    --action-execute: #ff6b00;
    --action-configure: #e000c5;
    --action-global: #4f46e5;
    --action-delete: #f21d4b;
    color: var(--foreground);
  }

  #action-color-a-v5 .mockup { overflow: hidden; }

  #action-color-a-v5 .page-bar,
  #action-color-a-v5 .actions,
  #action-color-a-v5 .focus-pair {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
  }

  #action-color-a-v5 .page-bar {
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }

  #action-color-a-v5 .primary-swatch {
    width: 34px;
    height: 8px;
    border-radius: 99px;
    background: var(--configured-primary);
  }

  #action-color-a-v5 .table-head,
  #action-color-a-v5 .table-row {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) minmax(90px, .55fr) minmax(350px, 2.4fr);
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
  }

  #action-color-a-v5 .table-head {
    color: var(--muted-foreground);
    background: color-mix(in srgb, var(--configured-primary) 8%, var(--card));
    font-weight: 500;
  }

  #action-color-a-v5 .table-row { border-bottom: 1px solid var(--border); }

  #action-color-a-v5 .action {
    min-height: 28px;
    padding: 4px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--action-color);
    font: inherit;
    font-weight: 500;
  }

  #action-color-a-v5 .action:hover,
  #action-color-a-v5 .action:focus-visible {
    background: color-mix(in srgb, var(--action-color) 14%, transparent);
  }

  #action-color-a-v5 .edit { --action-color: var(--configured-primary); }
  #action-color-a-v5 .detail { --action-color: var(--action-detail); }
  #action-color-a-v5 .execute { --action-color: var(--action-execute); }
  #action-color-a-v5 .configure { --action-color: var(--action-configure); }
  #action-color-a-v5 .global { --action-color: var(--action-global); }
  #action-color-a-v5 .delete { --action-color: var(--action-delete); }

  #action-color-a-v5 .focus-pair {
    margin-top: 16px;
    padding: 12px 14px;
    border-left: 3px solid var(--action-configure);
    background: color-mix(in srgb, var(--action-configure) 7%, transparent);
  }

  #action-color-a-v5 .rule-line {
    margin-top: 14px;
    color: var(--muted-foreground);
  }

  #action-color-a-v5 .confirm-choice { margin-top: 18px; }

  @media (max-width: 640px) {
    #action-color-a-v5 .table-head,
    #action-color-a-v5 .table-row { grid-template-columns: 1fr; }
    #action-color-a-v5 .table-head span:not(:last-child),
    #action-color-a-v5 .table-row > span:nth-child(2) { display: none; }
  }
</style>

<div id="action-color-a-v5">
  <h2>A 方案第五版</h2>
  <p class="subtitle">编辑跟随已配置的主题主色；其他操作尽可能使用高饱和亮色。</p>

  <div class="mockup">
    <div class="page-bar">
      <span class="actions"><span class="primary-swatch"></span>变量管理</span>
      <span class="text-muted">当前配置：凝液紫</span>
    </div>
    <div class="table-head"><span>变量名称</span><span>类型</span><span>操作</span></div>
    <div class="table-row">
      <span>近 30 天申请次数</span><span>数值</span>
      <span class="actions">
        <button class="action edit">编辑</button>
        <button class="action detail">详情</button>
        <button class="action execute">测试</button>
        <button class="action configure">选项</button>
        <button class="action global">转为全局</button>
        <button class="action delete">删除</button>
      </span>
    </div>
  </div>

  <div class="focus-pair">
    <button class="action configure">选项 · 亮洋红</button>
    <button class="action global">转为全局 · 亮靛蓝</button>
  </div>

  <p class="rule-line">落地规则：编辑读取当前主题变量；其余颜色避开黄、灰、绿、青，并校验与主题色及同列其他操作色的距离。</p>

  <div class="options confirm-choice">
    <div class="option" data-choice="a-v5" onclick="toggleSelect(this)">
      <div class="letter">A5</div>
      <div class="content">
        <h3>采用这一版</h3>
        <p>配置主题色编辑 + 高亮语义色操作。</p>
      </div>
    </div>
  </div>
</div>
